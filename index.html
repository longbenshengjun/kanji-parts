<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ばらばら かんじ パズル</title>
<style>
:root{
  --bg:#fff8ec; --ink:#2b2b2b; --card:#ffffff; --accent:#ff8a3d; --accent2:#3aa0e8;
  --slot:#eef6ff; --slotline:#8fbfe8; --ok:#2fb36b; --piece:#fffdf6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden;touch-action:none}
button{font-family:inherit;cursor:pointer;border:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.screen.on{display:flex}

/* タイトル・単元 */
#title,#units{justify-content:center;gap:24px;background:radial-gradient(circle at 50% 30%,#fff 0,var(--bg) 70%)}
h1{margin:0;font-size:clamp(34px,6vw,60px);letter-spacing:.08em;color:var(--accent);text-shadow:3px 3px 0 #ffd9b8;text-align:center}
.lead{margin:0;font-size:clamp(20px,3vw,28px)}
.grade{background:var(--accent);color:#fff;font-size:clamp(40px,7vw,64px);font-weight:bold;width:min(260px,60vw);aspect-ratio:1;border-radius:36px;box-shadow:0 8px 0 #d06a24}
.grade:active{transform:translateY(5px);box-shadow:0 3px 0 #d06a24}
.unitlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;width:min(980px,100%);overflow-y:auto;padding:4px 4px 10px;touch-action:pan-y}
.unit{background:var(--accent2);color:#fff;font-size:clamp(18px,2.2vw,23px);padding:14px 18px;border-radius:20px;box-shadow:0 5px 0 #2479b5;font-weight:bold;text-align:left;display:flex;align-items:center;gap:12px}
.unit:active{transform:translateY(4px);box-shadow:0 1px 0 #2479b5}
.unit .no{background:#fff;color:var(--accent2);border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;flex:none}
.unit small{display:block;font-size:.62em;font-weight:normal;margin-top:4px;opacity:.95;letter-spacing:.1em}
.unit.review{background:#9a6be8;box-shadow:0 5px 0 #7146b8}
.unit.review .no{color:#9a6be8}
.topbar{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px}

/* ゲーム */
#game{padding-bottom:max(12px,env(safe-area-inset-bottom));gap:10px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar h2{margin:0;font-size:clamp(18px,2.8vw,28px);text-align:center}
.prog{min-width:90px;text-align:right;font-size:clamp(16px,2.2vw,22px);color:#b07a3c;font-weight:bold}
.back{background:#ddd;color:#333;font-size:18px;padding:10px 16px;border-radius:14px}
.answers{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%}
.acard{background:var(--card);border-radius:18px;padding:10px;box-shadow:0 3px 10px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:6px}
.abox{width:var(--box);height:var(--box);display:flex}
.grp{display:flex;gap:6px;flex:1 1 0;min-width:0;min-height:0}
.grp.v{flex-direction:column}
.slot{flex:1 1 0;min-width:0;min-height:0;border:3px dashed var(--slotline);border-radius:12px;background:var(--slot);position:relative;overflow:hidden;transition:background .15s}
.slot.hover{background:#d4ebff;border-color:var(--accent2)}
.slot .piece{position:absolute;inset:0;width:auto;height:auto;border:none;background:transparent;box-shadow:none;padding:4px}
.slot.filled{border-style:solid;border-color:#c9dcef;background:#fff}
.yomi{font-size:clamp(16px,2.2vw,22px);color:#555}
.yomi b{color:var(--accent);font-size:1.15em}

.tray{flex:1;width:100%;min-height:0;background:#fff2dc;border:3px solid #ffd7a8;border-radius:22px;position:relative;
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:14px;padding:14px;overflow:hidden}
.tray-label{position:absolute;left:14px;top:8px;font-size:15px;color:#b07a3c}
.piece{background:var(--piece);border:2px solid #e8d2b0;border-radius:14px;box-shadow:0 4px 0 #e2c79f;padding:8px;touch-action:none;display:block}
.piece svg{display:block;width:100%;height:100%;overflow:hidden;pointer-events:none}
.piece path{fill:var(--ink)}
.piece.dragging{opacity:.25}
.floating{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 10px 24px rgba(0,0,0,.25)}

.done{background:var(--ok);color:#fff;font-size:clamp(28px,4vw,40px);font-weight:bold;padding:12px 56px;border-radius:999px;box-shadow:0 6px 0 #1f8a50}
.done:active{transform:translateY(4px);box-shadow:0 2px 0 #1f8a50}

/* モーダル */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:28px;padding:28px 34px;text-align:center;max-width:760px;width:100%;animation:pop .35s ease}
.mbox h3{margin:0 0 10px;font-size:clamp(30px,5vw,48px)}
.mbox p{margin:0 0 18px;font-size:clamp(20px,3vw,26px)}
.mbtn{font-size:clamp(22px,3vw,28px);padding:14px 30px;border-radius:18px;color:#fff;font-weight:bold;margin:6px}
.mbtn.blue{background:var(--accent2);box-shadow:0 5px 0 #2479b5}
.mbtn.orange{background:var(--accent);box-shadow:0 5px 0 #d06a24}
.mbtn.green{background:var(--ok);box-shadow:0 5px 0 #1f8a50}
.mbtn.gray{background:#9a9a9a;box-shadow:0 5px 0 #777}
.finals{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 18px}
.final{width:84px;height:84px;background:#fffdf6;border:2px solid #e8d2b0;border-radius:14px;padding:6px}
.final svg{width:100%;height:100%}
.final path{fill:var(--ink)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s ease 2}
.placed{animation:pop .2s ease}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:90;pointer-events:none;border-radius:3px}
</style>
</head>
<body>

<section id="title" class="screen on">
  <h1>ばらばら かんじ パズル</h1>
  <p class="lead">がくねんを えらんでね</p>
  <button class="grade" id="g1">1ねん</button>
</section>

<section id="units" class="screen">
  <div class="topbar"><button class="back" id="backTitle">◀ もどる</button></div>
  <h1 style="font-size:clamp(28px,4.5vw,44px)">1ねん</h1>
  <p class="lead">たんげんを えらんでね</p>
  <div class="unitlist" id="unitlist"></div>
</section>

  </div>
  <div class="answers" id="answers"></div>
  <div class="tray" id="tray"><span class="tray-label">パーツを □ に うごかそう</span></div>
  <button class="done" id="doneBtn">できた！</button>
</section>

function tone(freq,dur,type='sine',delay=0,vol=.25){
  try{

    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;

  }catch(e){}
}

function makeRounds(list){
  const n=Math.ceil(list.length/MAXK), out=[];let p=0;
  for(let r=0;r<n;r++){const c=Math.ceil((list.length-p)/(n-r));out.push(list.slice(p,p+c));p+=c;}
  return out;
}
function start(i){
  unit=UNITS[i];
  let list=[...unit.kanji];
  if(unit.review) shuffleArr(list);
  rounds=makeRounds(list);ri=0;
  $('unitName').textContent=(i+1)+'「'+unit.name+'」';
  show('game');build();
}
function layoutSize(){
  const n=cur.length, W=window.innerWidth-32, H=window.innerHeight;
  let box=Math.min((W-14*(n-1))/n-20, H*0.26, 190);
  if(box<105){box=Math.min((W-14*2)/3-20,H*0.2,170);}
  document.documentElement.style.setProperty('--box',Math.max(90,Math.floor(box))+'px');
}
function pieceScale(){
  const W=window.innerWidth,H=window.innerHeight;
  return Math.max(0.08,Math.min(0.13, W/7600, H/6000));
}
function pieceSize(p,sc){
  return [Math.max(64,Math.round((p.box[2]+PAD*2)*sc+20)), Math.max(64,Math.round((p.box[3]+PAD*2)*sc+20))];
}
function extent(k,node,dir){ // ならびの むきの おおきさ
  const ids=[];(function f(n){if(typeof n==='number')ids.push(n);else n[1].forEach(f)})(node);
  const bs=ids.map(i=>KANJI[k].parts[i].box);
  const a=dir==='v'?1:0, s=dir==='v'?3:2;
  return Math.max(...bs.map(b=>b[a]+b[s]))-Math.min(...bs.map(b=>b[a]))+PAD*2;
}
function buildNode(k,node,parentDir){
  if(typeof node==='number'){
    const p=KANJI[k].parts[node];
    const s=document.createElement('div');s.className='slot';
    s.dataset.key=p.key;s.dataset.k=k;
    if(parentDir)s.style.flexGrow=extent(k,node,parentDir);
    pieces.push({k,key:p.key,p});
    return s;
  }
  const g=document.createElement('div');g.className='grp '+node[0];
  if(parentDir)g.style.flexGrow=extent(k,node,parentDir);
  node[1].forEach(c=>g.appendChild(buildNode(k,c,node[0])));
  return g;
}
function build(){
  cur=rounds[ri];
  $('prog').textContent=rounds.length>1?`${ri+1} / ${rounds.length}`:'';
  layoutSize();
  const ans=$('answers');ans.innerHTML='';pieces=[];
  cur.forEach(k=>{
    const c=document.createElement('div');c.className='acard';
    const box=document.createElement('div');box.className='abox';
    box.appendChild(buildNode(k,KANJI[k].layout,null));
    c.appendChild(box);
    const y=document.createElement('div');y.className='yomi';y.innerHTML=KANJI[k].yomi;c.appendChild(y);
    ans.appendChild(c);
  });
  const tray=$('tray');tray.querySelectorAll('.piece').forEach(e=>e.remove());
  const sc=pieceScale();
  pieces.forEach((pc,idx)=>{
    const el=document.createElement('div');el.className='piece';
    el.dataset.idx=idx;el.innerHTML=partSVG(pc.p);
    const [w,h]=pieceSize(pc.p,sc);
    pc.trayW=w+'px';pc.trayH=h+'px';el.style.width=pc.trayW;el.style.height=pc.trayH;
    pc.el=el;pc.slot=null;
    el.addEventListener('pointerdown',onDown);
  });
  shuffle(pieces.slice()).forEach(pc=>tray.appendChild(pc.el));
}
function shuffle(a){
  for(let t=0;t<20;t++){
    shuffleArr(a);
    let ok=true;for(let i=0;i+1<a.length;i++) if(a[i].k===a[i+1].k) ok=false;
    if(ok)break;
  }
  return a;
}
function toTray(pc){
  if(pc.slot){pc.slot.classList.remove('filled');pc.slot=null;}
  pc.el.style.width=pc.trayW;pc.el.style.height=pc.trayH;
  $('tray').appendChild(pc.el);
}
function toSlot(pc,slot){
  const other=pieces.find(q=>q.slot===slot&&q!==pc);
  if(other) toTray(other);
  if(pc.slot) pc.slot.classList.remove('filled');
  pc.slot=slot;slot.classList.add('filled');
  pc.el.style.width='';pc.el.style.height='';
  slot.appendChild(pc.el);
  pc.el.classList.remove('placed');void pc.el.offsetWidth;pc.el.classList.add('placed');
}

/* ---------- ドラッグ ---------- */
function onDown(e){
  if(drag) return;
  e.preventDefault();
  const el=e.currentTarget, pc=pieces[+el.dataset.idx], r=el.getBoundingClientRect();
  const fl=el.cloneNode(true);fl.classList.add('floating');
  const [w,h]=pieceSize(pc.p,pieceScale());
  fl.style.width=Math.max(r.width,w)+'px';fl.style.height=Math.max(r.height,h)+'px';
  fl.style.left=e.clientX+'px';fl.style.top=e.clientY+'px';
  document.body.appendChild(fl);el.classList.add('dragging');
  drag={pc,fl,id:e.pointerId,hover:null};
  sPick();
}
function slotAt(x,y){
  const els=document.elementsFromPoint(x,y);
  for(const el of els){const s=el.closest&&el.closest('.slot');if(s)return s;}
  let best=null,bd=50;   // ゆびで かくれても ちかくの □ に はいるように
  document.querySelectorAll('.slot').forEach(s=>{
    const r=s.getBoundingClientRect();
    const dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom),d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=s;}
  });
  return best;
}
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  e.preventDefault();
  drag.fl.style.left=e.clientX+'px';drag.fl.style.top=e.clientY+'px';
  const s=slotAt(e.clientX,e.clientY);
  if(s!==drag.hover){if(drag.hover)drag.hover.classList.remove('hover');drag.hover=s;if(s)s.classList.add('hover');}
},{passive:false});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const {pc,fl,hover}=drag;
  if(hover)hover.classList.remove('hover');
  fl.remove();pc.el.classList.remove('dragging');
  if(hover){toSlot(pc,hover);sPut();}
  else if(pc.slot){toTray(pc);}
  drag=null;
}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);

/* ---------- できた ---------- */
$('doneBtn').onclick=()=>{
  const slots=[...document.querySelectorAll('#answers .slot')];
  const empty=slots.filter(s=>!s.classList.contains('filled'));
  if(empty.length){
    empty.forEach(s=>{s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')});
    modal(`<h3>🤔</h3><p>まだ あいている □ が あるよ。<br>ぜんぶ うごかしてから おしてね。</p>
      <button class="mbtn blue" onclick="closeModal()">わかった</button>`);
    return;
  }
  // おなじ かたちの パーツ（子・木 など）は どちらに いれても せいかい
  const ok=pieces.every(pc=>pc.slot&&pc.slot.dataset.key===pc.key);
  const finals=`<div class="finals">${cur.map(k=>`<div class="final">${fullSVG(k)}</div>`).join('')}</div>`;
  if(ok){
    confetti();
    if(ri<rounds.length-1){
      sOK();
      modal(`<h3>🎉 できた！ 🎉</h3><p>ぜんぶ せいかい！ すごいね！</p>${finals}
        <button class="mbtn green" onclick="closeModal();ri++;build()">つぎへ ▶</button>`);
    }else{
      sAll();
      modal(`<h3>🏆 ぜんぶ クリア！ 🏆</h3><p>「${unit.name}」の かんじ、ぜんぶ できたね！</p>${finals}
        <button class="mbtn orange" onclick="closeModal();start(UNITS.indexOf(unit))">もういちど</button>
        <button class="mbtn gray" onclick="closeModal();show('units')">たんげんを えらぶ</button>`);
    }
  }else{
    sNG();
    modal(`<h3>おしい！</h3><p>まちがいが あるよ。<br>もういちど やってみよう！</p>
      <button class="mbtn blue" onclick="closeModal();build()">やりなおす</button>`);
  }
};
function modal(h){$('mbox').innerHTML=h;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
function confetti(){
  const cols=['#ff8a3d','#3aa0e8','#2fb36b','#ffd23d','#e8505b','#a46be8'];
  for(let i=0;i<70;i++){
    const d=document.createElement('div');d.className='confetti';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    document.body.appendChild(d);
    d.animate([{transform:'translateY(0) rotate(0)'},{transform:`translateY(${innerHeight+60}px) rotate(${Math.random()*720}deg)`}],
      {duration:2000+Math.random()*1800,delay:Math.random()*600,easing:'ease-in'}).onfinish=()=>d.remove();
  }
}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(unit&&$('game').classList.contains('on')){layoutSize();
  const sc=pieceScale();pieces.forEach(pc=>{const [w,h]=pieceSize(pc.p,sc);pc.trayW=w+'px';pc.trayH=h+'px';if(!pc.slot){pc.el.style.width=pc.trayW;pc.el.style.height=pc.trayH;}});}},200)});
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
