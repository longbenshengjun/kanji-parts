<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>がくしゅう ひろば</title>
<style>
:root{--bg:#fff8ec;--ink:#2b2b2b;--accent:#ff8a3d;--accent2:#3aa0e8;--green:#2f9e6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif}
button,a{font-family:inherit;cursor:pointer;border:none;text-decoration:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  padding:16px;padding-top:max(16px,env(safe-area-inset-top));background:radial-gradient(circle at 50% 30%,#fff 0,var(--bg) 70%)}
.screen.on{display:flex}
h1{margin:0;font-size:clamp(34px,6vw,60px);letter-spacing:.08em;color:var(--accent);text-shadow:3px 3px 0 #ffd9b8;text-align:center}
.lead{margin:0;font-size:clamp(20px,3vw,28px)}
.grade{background:var(--accent);color:#fff;font-size:clamp(40px,7vw,64px);font-weight:bold;width:min(260px,60vw);aspect-ratio:1;border-radius:36px;box-shadow:0 8px 0 #d06a24}
.grade:active{transform:translateY(5px);box-shadow:0 3px 0 #d06a24}
.list{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;width:min(900px,100%)}
.game{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:bold;
  font-size:clamp(28px,4.5vw,40px);width:min(360px,100%);padding:30px 16px;border-radius:28px;letter-spacing:.06em}
.game small{font-size:.5em;font-weight:normal;letter-spacing:.1em}
.game.k{background:var(--accent2);box-shadow:0 7px 0 #2479b5}
.game.c{background:var(--green);box-shadow:0 7px 0 #1f7049}
.game:active{transform:translateY(5px);box-shadow:0 2px 0 #0003}
.topbar{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px}
.back{background:#ddd;color:#333;font-size:18px;padding:10px 16px;border-radius:14px}
button:focus-visible,a:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<section id="title" class="screen on">
  <h1>がくしゅう ひろば</h1>
  <p class="lead">がくねんを えらんでね</p>
  <button class="grade" id="g1">1ねん</button>
</section>
<section id="menu" class="screen">
  <div class="topbar"><button class="back" id="back">◀ もどる</button></div>
  <h1 style="font-size:clamp(28px,4.5vw,44px)">1ねん</h1>
  <p class="lead">やりたい ものを えらんでね</p>
  <div class="list">
    <a class="game k" href="kanji.html">ばらばらかん字<small>かんじパズル</small></a>
    <a class="game c" href="kazoekata.html">かぞえかた<small>いっぴき・にさつ…</small></a>
  </div>
</section>
<script>
const show=id=>document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
document.getElementById('g1').onclick=()=>{show('menu');location.hash='g1';};
document.getElementById('back').onclick=()=>{show('title');history.replaceState(null,'',location.pathname);};
if(location.hash==='#g1') show('menu');
</script>
</body>
</html>
