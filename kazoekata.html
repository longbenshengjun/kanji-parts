<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>かずの かぞえかた クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* layout: one centered play column — progress dots, picture card, 2x2 answer buttons */
:root{
  --bg:#dcefe9; --bg2:#c6e4da; --ink:#2b3a36; --sub:#5d706a;
  --paper:#f4ebda; --paper-edge:#e2d4bb;
  --btn:#ffffff; --btn-edge:#b9d3ca; --btn-ink:#23413a;
  --good:#2f9e6b; --good-bg:#d8f3e4; --bad:#d4553f; --bad-bg:#fbe1dc;
  --accent:#f08a24; --dot:#b5cfc6;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17262a; --bg2:#1f3338; --ink:#eaf3ef; --sub:#a6bbb4;
  --paper:#f4ebda; --paper-edge:#3a4f53;
  --btn:#243a3f; --btn-edge:#38575d; --btn-ink:#f1f7f4;
  --good:#5cd39b; --good-bg:#1d4535; --bad:#ff8a74; --bad-bg:#4b2621;
  --accent:#ffa64d; --dot:#3d575c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17262a; --bg2:#1f3338; --ink:#eaf3ef; --sub:#a6bbb4;
  --paper:#f4ebda; --paper-edge:#3a4f53;
  --btn:#243a3f; --btn-edge:#38575d; --btn-ink:#f1f7f4;
  --good:#5cd39b; --good-bg:#1d4535; --bad:#ff8a74; --bad-bg:#4b2621;
  --accent:#ffa64d; --dot:#3d575c; color-scheme:dark}
html,body{height:100%;margin:0}
body{padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:700;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}
.home{font-size:18px;color:var(--btn-ink);background:var(--btn);border:2px solid var(--btn-edge);border-radius:14px;padding:8px 14px;text-decoration:none}
h1{flex:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(20px,3.4vw,28px);font-weight:900;letter-spacing:.04em;text-wrap:balance}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--dot);display:block;transition:transform .2s}
.dots i.now{background:var(--accent);transform:scale(1.25)}
.dots i.ok{background:var(--good)}
.dots i.ng{background:var(--bad)}
.q{font-size:clamp(20px,3.6vw,30px);text-align:center;margin:0;line-height:1.5}
.q .name{color:var(--accent)}
.card{background:var(--paper);border:3px solid var(--paper-edge);border-radius:22px;min-height:220px;
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:14px 18px;padding:22px 16px;box-sizing:border-box}
.card img{display:block;height:var(--h,110px);width:auto;max-width:100%;
  animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*70ms);border-radius:6px}
@keyframes pop{from{transform:scale(.4);opacity:.2}to{transform:none;opacity:1}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choices button{font:inherit;font-weight:900;font-size:clamp(26px,5vw,40px);letter-spacing:.08em;
  background:var(--btn);color:var(--btn-ink);border:3px solid var(--btn-edge);border-bottom-width:7px;
  border-radius:20px;padding:18px 8px;cursor:pointer;transition:transform .08s}
.choices button:active{transform:translateY(3px);border-bottom-width:4px}
.choices button:focus-visible,.big:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.choices button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.choices button.ng{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.choices button:disabled{cursor:default}
.msg{min-height:1.6em;text-align:center;font-size:clamp(20px,3.6vw,28px);margin:0}
.msg.ok{color:var(--good)} .msg.ng{color:var(--bad)}
.big{font:inherit;font-weight:900;font-size:26px;background:var(--accent);color:#fff;border:0;border-bottom:6px solid #c46612;
  border-radius:999px;padding:14px 40px;cursor:pointer;align-self:center}
.big:active{transform:translateY(3px);border-bottom-width:3px}
.end{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding-top:30px}
.end .score{font-size:clamp(24px,4vw,34px);margin:0}
.end .yatta{font-size:clamp(34px,7vw,60px);font-weight:900;color:var(--accent);margin:0;line-height:1.35;text-wrap:balance}
#confetti{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.card img{animation:none}.dots i{transition:none}}
@media (max-width:480px){.card{min-height:180px}.choices{gap:10px}}
</style>

</head>

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="2" fill="${color}" stroke="#00000030" stroke-width="1.5"/><path d="M8 8 L92 92" stroke="${dark}" stroke-width="1.2" opacity=".5"/><path d="M92 8 L8 92" stroke="${dark}" stroke-width="1.2" opacity=".35"/><path d="M92 92 L72 92 L92 72 Z" fill="#ffffff"/><path d="M72 92 L92 72 L76 76 Z" fill="${dark}" opacity=".35"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const ORIGAMI = [['#e94b5a','#9e2433'],['#3d8fe0','#1d5394'],['#f6c22e','#b8860b'],['#4cb86b','#23703b'],['#a06ad9','#5f3191']].map(c=>origami(c[0],c[1]));

// 読み方：[1,2,3,4,5]
const ITEMS = [
  {key:'car',    name:'くるま',     imgs:[IMG.car, IMG.car2], h:80,  read:['いちだい','にだい','さんだい','よんだい','ごだい']},
  {key:'pencil', name:'えんぴつ',   imgs:[IMG.pencil], h:60,       read:['いっぽん','にほん','さんぼん','よんほん','ごほん']},
  {key:'book',   name:'ほん',       imgs:[IMG.note, IMG.note2], h:100, read:['いっさつ','にさつ','さんさつ','よんさつ','ごさつ']},
  {key:'dog',    name:'いぬ',       imgs:[IMG.dog], h:105,         read:['いっぴき','にひき','さんびき','よんひき','ごひき']},
  {key:'origami',name:'おりがみ',   imgs:ORIGAMI, h:90,            read:['いちまい','にまい','さんまい','よんまい','ごまい']},
  {key:'onigiri',name:'おにぎり',   imgs:[IMG.onigiri], h:95,      read:['いっこ','にこ','さんこ','よんこ','ごこ']},
  {key:'person', name:'ひと',       imgs:[IMG.person, IMG.person2], h:130, read:['ひとり','ふたり','さんにん','よにん','ごにん']},
];
const TOTAL = 10;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

let qs=[], idx=0, results=[];
const app=document.getElementById('app');

function makeQuestions(){
  // 同じ絵が続かないように、もの×かず の組み合わせから10問
  const all=[]; ITEMS.forEach((it,i)=>{for(let n=1;n<=5;n++) all.push({i,n});});
  let pick;
  for(let t=0;t<50;t++){
    pick=shuffle(all).slice(0,TOTAL);
    if(pick.every((p,k)=>k===0||p.i!==pick[k-1].i)) break;
  }
  return pick.map(({i,n})=>{
    const it=ITEMS[i], ans=it.read[n-1];
    // おなじ かず・ちがう たんい を3つ（たんいが かさならない）
    const others=shuffle(ITEMS.filter((_,k)=>k!==i)).slice(0,3).map(o=>o.read[n-1]);
    const opts=[ans,...others];
    return {it,n,ans,opts:shuffle(opts)};
  });
}

function dots(){
  return '<div class="dots" aria-label="'+(idx+1)+'もんめ">'+Array.from({length:TOTAL},(_,k)=>{
    const c = k<results.length ? (results[k]?'ok':'ng') : (k===idx?'now':'');
    return `<i class="${c}"></i>`;}).join('')+'</div>';
}

function render(){
  const q=qs[idx];
  const imgs=Array.from({length:q.n},(_,k)=>{
    const src=q.it.imgs[k % q.it.imgs.length];
    return `<img src="${src}" alt="" style="--i:${k};--h:${q.it.h}px">`;}).join('');
  app.innerHTML=`
    <header><a class="home" href="index.html#g1">◀ もどる</a><h1>かずの かぞえかた</h1>${dots()}</header>
    <p class="q"><span class="name">${q.it.name}</span>は いくつ？ ただしい いいかたを えらぼう</p>
    <div class="card" role="img" aria-label="${q.it.name}">${imgs}</div>
    <div class="choices">${q.opts.map((o,k)=>`<button id="opt${k}" type="button">${o}</button>`).join('')}</div>
    <p class="msg" id="msg"></p>`;
  app.querySelectorAll('.choices button').forEach(b=>b.addEventListener('click',()=>answer(b)));
}

let actx=null;
function pinpon(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const t=actx.currentTime;
    [[1318.5,0],[1046.5,0.32]].forEach(([f,d])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+d);
      g.gain.exponentialRampToValueAtTime(0.5,t+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.6);
      o.connect(g).connect(actx.destination); o.start(t+d); o.stop(t+d+0.65);
    });
  }catch(e){}
}
function answer(btn){
  const q=qs[idx]; const ok=btn.textContent===q.ans;
  const btns=app.querySelectorAll('.choices button');
  btns.forEach(b=>{b.disabled=true; if(b.textContent===q.ans) b.classList.add('ok');});
  if(!ok) btn.classList.add('ng');
  if(ok) pinpon();
  results.push(ok);
  const msg=document.getElementById('msg');
  msg.className='msg '+(ok?'ok':'ng');
  msg.textContent= ok ? 'せいかい！' : `ざんねん。こたえは「${q.ans}」だよ`;
  app.querySelector('header').outerHTML;
  app.querySelector('.dots').outerHTML=dots();
  const next=document.createElement('button');
  next.className='big'; next.id='next'; next.type='button';
  next.textContent= idx+1<TOTAL ? 'つぎへ' : 'けっかを みる';
  next.addEventListener('click',()=>{ idx++; idx<TOTAL ? render() : finish(); });
  app.appendChild(next); next.focus({preventScroll:true});
}

function finish(){
  const score=results.filter(Boolean).length;
  const perfect=score===TOTAL;
  app.innerHTML=`
    <header><a class="home" href="index.html#g1">◀ もどる</a><h1>かずの かぞえかた</h1>${dots()}</header>
    <div class="end">
      <p class="score">${TOTAL}もん ちゅう ${score}もん せいかい</p>
      ${perfect ? '<p class="yatta">ぜんぶ せいかいだよ<br>やったね！</p>' : '<p class="score">もういちど ちょうせん してみよう</p>'}
      <button class="big" id="again" type="button">もういちど</button>
    </div>`;
  document.getElementById('again').addEventListener('click',start);
  if(perfect) confetti();
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'); cv.hidden=false;
  const ctx=cv.getContext('2d'); const W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cols=['#e94b5a','#3d8fe0','#f6c22e','#4cb86b','#a06ad9','#f08a24'];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H,s:6+Math.random()*8,v:2+Math.random()*3,r:Math.random()*6,dr:(Math.random()-.5)*.2,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function step(){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin((p.y+p.r*50)/40);p.r+=p.dr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(++t<260) requestAnimationFrame(step); else {ctx.clearRect(0,0,W,H); cv.hidden=true;}
  })();
}

function start(){ qs=makeQuestions(); idx=0; results=[]; render(); }
start();
</script>
